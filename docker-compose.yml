services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-medbridge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-medbridge}", "-d", "${POSTGRES_DB:-medbridge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: medbridge/api-migrate:dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-medbridge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-medbridge}
      SEED_PASSWORD: ${SEED_PASSWORD:-CorrectHorseBatteryStaple1!}
    command: ["sh", "-c", "pnpm drizzle-kit migrate && node dist/seed/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: medbridge/api:dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-medbridge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-medbridge}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/lib/medbridge/uploads}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: ${PORT:-3000}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/var/lib/medbridge/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
