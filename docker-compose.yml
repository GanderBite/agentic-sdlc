name: medbridge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-medbridge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-medbridge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medbridge}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["sh", "-c", "pnpm drizzle-kit migrate && node dist/seed/main.js"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-medbridge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medbridge}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/app/uploads}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata: {}
